name: CI/CD Pipeline - Survival Preparedness Strategist

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  BUN_VERSION: 'latest'

jobs:
  # ============================================================================
  # BUILD JOB
  # ============================================================================
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run type-check

      - name: Build project
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # ============================================================================
  # LINT JOB
  # ============================================================================
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      - name: Run Prettier check
        run: bun run format:check

      - name: Security audit
        run: bun audit

  # ============================================================================
  # TEST JOB
  # ============================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [build]

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-output

      - name: Run unit tests
        run: bun test tests/test-runner.ts --timeout 60000

      - name: Generate coverage report
        run: bun test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # ============================================================================
  # INTEGRATION TEST JOB
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run integration tests
        run: bun test tests/integration/
        env:
          REDIS_URL: redis://localhost:6379

  # ============================================================================
  # SAFETY TEST JOB
  # ============================================================================
  safety-test:
    name: Safety and Guardrail Tests
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run safety tests
        run: bun test tests/safety/

      - name: Verify weapon exclusion
        run: |
          echo "Checking for weapon/violence content..."
          if grep -r -i "weapon\|gun\|firearm\|explosive\|violence" tools/ references/ --exclude-dir=node_modules; then
            echo "ERROR: Weapon/violence content found!"
            exit 1
          fi
          echo "PASS: No weapon/violence content found"

      - name: Verify disclaimer presence
        run: |
          echo "Checking for disclaimer presence..."
          if ! grep -r "Disclaimer" SKILL.md; then
            echo "ERROR: Disclaimer not found in SKILL.md!"
            exit 1
          fi
          echo "PASS: Disclaimer present"

  # ============================================================================
  # PERFORMANCE TEST JOB
  # ============================================================================
  performance-test:
    name: Performance and Load Tests
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run performance tests
        run: bun test tests/performance/

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: tests/performance/results/

  # ============================================================================
  # SECURITY SCAN JOB
  # ============================================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v2
        with:
          languages: javascript

  # ============================================================================
  # DEPLOY JOB
  # ============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, lint, test, integration-test, safety-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://api.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-output

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add actual deployment commands here
          # Example: bun run deploy

      - name: Run smoke tests
        run: bun test tests/smoke/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/**
            README.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment to production successful!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

  # ============================================================================
  # ROLLBACK JOB
  # ============================================================================
  rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rollback to previous version
        run: |
          echo "Initiating emergency rollback..."
          # Add rollback commands here
          # Example: bun run rollback

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: 'failure'
          text: 'Emergency rollback initiated!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================================================
  # MONITORING JOB
  # ============================================================================
  monitoring:
    name: Update Monitoring Dashboards
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Update deployment metrics
        run: |
          echo "Updating monitoring dashboards..."
          # Add monitoring update commands here

      - name: Record deployment
        uses: datamonad/thingy-action@master
        with:
          status: ${{ needs.deploy.result }}
          description: 'Production deployment'
